# The system user splitforge-edge.service runs as.
#
# Install to /usr/lib/sysusers.d/splitforge.conf and apply with
# `systemd-sysusers`, or create the account by hand — see docs/deployment.md.
#
# No login shell and no home directory: this account exists to own a database and a socket,
# and anything else it could do is a way for a compromise of the service to become a
# compromise of the device.
#
# The *group* is the access control for the API socket (ADR-0021). Adding an operator to
# it grants them the health endpoint; that is the whole permission model, so add people to
# it deliberately.
u splitforge - "SplitForge race timing service" /var/lib/splitforge /usr/sbin/nologin
