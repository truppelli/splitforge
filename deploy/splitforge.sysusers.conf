# The system users the SplitForge units run as.
#
# Install to /usr/lib/sysusers.d/splitforge.conf and apply with
# `systemd-sysusers`, or create the accounts by hand — see docs/deployment.md.
#
# No login shell and no home directory: these accounts exist to own a database and a socket,
# and anything else they could do is a way for a compromise of a service to become a
# compromise of the device.
#
# The *group* is the access control for the API socket (ADR-0021), and it is more than that.
# Adding an operator to it grants them the health endpoint and read access to the event:
# the database with every participant's name, and the sidecar with every raw read. It does
# not grant writing either. Add people to it deliberately — see docs/deployment.md.
u splitforge - "SplitForge race timing service" /var/lib/splitforge /usr/sbin/nologin

# splitforge-ship.service, the RaceDay Connect publisher (ADR-0047). A separate account, so the
# kernel refuses it the event database's write access, and a member of the splitforge group so
# it can read that database. Only where results are published to RaceDay Connect.
u splitforge-ship - "SplitForge RaceDay Connect publisher" /var/lib/splitforge-ship /usr/sbin/nologin
m splitforge-ship splitforge
