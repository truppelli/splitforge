# Kernel modules loaded at boot for splitforge-edge.service.
#
# Install to /etc/modules-load.d/splitforge.conf — see docs/deployment.md.
#
# usbserial registers the ttyUSB device group, and the unit's DeviceAllow=char-ttyUSB is looked
# up in /proc/devices when the service starts. Left to udev, the driver loads when a bridge is
# plugged in, so a Pi booted with the reader unplugged starts the service first. The filter then
# allows nothing, every open of the port is "Operation not permitted" for as long as the service
# runs, and systemd reports why only at debug level (ADR-0034).
#
# systemd-modules-load.service runs before any ordinary service starts. Loading a driver the
# kernel has built in is harmless.
usbserial
