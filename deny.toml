# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
#
# Run locally with:  cargo deny check

[graph]
# Check the platforms SplitForge actually ships to: CI/dev hosts and the Pi.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Add advisory IDs here only with a comment explaining why the risk is accepted.
ignore = [
    # RUSTSEC-2026-0009 — stack exhaustion in `time`'s RFC **2822** parser, fixed in
    # 0.3.47. SplitForge cannot reach it: every timestamp it parses or emits is RFC 3339
    # (`time::serde::rfc3339`), and the string `Rfc2822` does not appear anywhere in this
    # workspace. No dependency enables `time`'s RFC 2822 path either.
    #
    # Not simply upgrading because `time` >= 0.3.47 requires Rust 1.88 and this workspace
    # pins `rust-version = "1.85"`. That trade is Q13 in docs/open-questions.md, and this
    # entry is the reason it stopped being theoretical.
    #
    # REVISIT when either happens, whichever comes first:
    #   - the MSRV moves to 1.88 or later — then delete this and upgrade
    #   - anything in this workspace starts parsing RFC 2822 (an email header, an HTTP
    #     date, a vendor export) — then the advisory becomes reachable and the MSRV has to
    #     move regardless
    "RUSTSEC-2026-0009",
]

[licenses]
version = 2
# Permissive licenses that may appear in the dependency tree. SplitForge itself is
# GPL-3.0-or-later (ADR-0007); these are licenses we are willing to *consume*.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# SplitForge's own crates are `publish = false`; their license is set once in
# [workspace.package] and does not need to appear in the allow list above.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Dependency count is kept deliberately small — every crate on the read path is a crate
# that can lose a read. Additions to the read path warrant an ADR.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
