[package]
name = "splitforge-cli"
description = "Configuration, diagnostics, exports, backup/restore, and admin commands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "splitforge_cli"
path = "src/lib.rs"

[[bin]]
name = "splitforge"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
csv.workspace = true
serde.workspace = true
serde_json.workspace = true
# Salted hashing of chip identifiers and operator names in the diagnostic bundle, so a
# bundle can be attached to a public issue without a roster leaving the device.
sha2.workspace = true
splitforge-domain.workspace = true
splitforge-engine.workspace = true
splitforge-export.workspace = true
splitforge-reader.workspace = true
splitforge-results.workspace = true
splitforge-simulator.workspace = true
splitforge-storage.workspace = true
# `doctor` reports the device's time source. The asking lives there because the service
# needs the same answer to stamp on every read it writes; this crate keeps the reporting.
splitforge-timesource.workspace = true
# Only for `splitforge fixture load`, which writes a built-in fixture's configuration into
# a real database so a simulated race is one command away instead of eight. Configuration
# itself now lives in SQLite (Milestone 2) — nothing here reads a fixture at derivation
# time any more.
splitforge-testkit.workspace = true
time.workspace = true
tokio.workspace = true
# The per-bundle salt. `Uuid::new_v4` is randomness the workspace already depends on.
uuid.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["process", "rt-multi-thread"] }
