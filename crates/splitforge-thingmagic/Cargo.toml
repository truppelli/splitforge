[package]
name = "splitforge-thingmagic"
description = "ThingMagic serial reader adapter: frame parsing, connection lifecycle, and reconnect."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

# `serialport` is here now because the code that opens a port is here now — ADR-0024
# authorizes it onto the read path, and the note that used to stand here said it would
# arrive with that code rather than one commit sooner.
#
# It is confined to `port::open`. Everything else in the crate takes a `PortFactory`, so
# the connection lifecycle is exercised against fakes that fail on demand rather than
# against hardware nobody has.
[dependencies]
serialport.workspace = true
splitforge-domain.workspace = true
splitforge-reader.workspace = true
thiserror.workspace = true
# The session anchor captures both clocks at once: `time` for the wall clock that says *when*,
# `std::time::Instant` for the monotonic one the subtraction actually rests on.
time.workspace = true
tokio.workspace = true

[lints]
workspace = true
