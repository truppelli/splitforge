[package]
name = "splitforge-storage"
description = "SQLite persistence for SplitForge: schema, migrations, repositories, and backups."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
fs4 = { version = "1.1.0", default-features = false }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
splitforge-domain.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true

# The process's real uid for the audit trail (ADR-0043). `getuid` by hand would need
# `unsafe`, denied workspace-wide. Already in the tree for the pseudo-terminal tests.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
