name: CI

on:
  push:
    branches: [main]
  pull_request:

# A superseded push has nothing to tell us. Cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      # The Pi may run an older toolchain than a developer laptop. Catch it here
      # rather than during a deploy the night before an event.
      #
      # `--all-targets` so tests are covered too: a dev-dependency that quietly raises
      # the MSRV is exactly the kind of thing that goes unnoticed until it matters.
      - run: cargo check --workspace --all-features --all-targets

  audit:
    name: Security advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      # cargo-audit reads Cargo.lock; generate it if it is not committed yet.
      - run: cargo generate-lockfile
      - run: cargo audit --deny warnings

  deny:
    name: Licenses and bans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  cross-build:
    name: Cross-build for Raspberry Pi (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      # Also the C cross-compiler: `rusqlite` is built with the `bundled` feature
      # (ADR-0009), so SQLite itself is compiled from source for the target.
      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      # Linker configuration lives in .cargo/config.toml (ADR-0002).
      #
      # The whole workspace, not just the edge service: the edge service is still empty,
      # and a cross-build that compiles nothing proves nothing.
      - name: Build for the Pi
        run: cargo build --release --target aarch64-unknown-linux-gnu --workspace
      # This proves the code COMPILES for the Pi. It proves nothing about reader
      # behavior, storage performance, or power-loss recovery — those are validated
      # on hardware or not at all. See docs/hardware-support.md.
